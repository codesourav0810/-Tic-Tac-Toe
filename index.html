<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tic-Tac-toe</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <header class="heading">
    <img src="heading.png" alt="">
  </header>
  <section class="setup-card">
    <h1 class="setup-heading">Ready to Play?</h1>

    <div class="player-input input1">
      <img src="cross.png" alt="" class="game-img">
        <label> Player 1</label>
        <input type="text" class="player1-input" placeholder="Enter your name" required>
    </div>

    <div class="player-input input2">
      <img src="circle.png" alt="" class="game-img">
        <label>Player 2</label>
        <input type="text" class="player2-input" placeholder="Enter your name" required>
    </div>

    <button class="start-game">Start Game</button>
</section>
  <section class="container">
      <div class="cell cell-1-1"></div>
      <div class="cell cell-1-2"></div>
      <div class="cell cell-1-3"></div>
      <div class="cell cell-2-1"></div>
      <div class="cell cell-2-2"></div>
      <div class="cell cell-2-3"></div>
      <div class="cell cell-3-1"></div>
      <div class="cell cell-3-2"></div>
      <div class="cell cell-3-3"></div>
  </section>
  <section class="players"> 
    <div class="player1">Player 1</div>
    <div class="player2">Player 2</div>
  </section>

  <section class="card">
    <div class="winner-card">
    <img src="WinnerLogo .png" alt="">
    <h2 class="winner-name">Player 1 Wins!!</h2>
    <h4>Congratulations You are a Champion!</h4>
    <button class="restart">Play Again</button>
</div>
  </section>
  <section class="draw-card">
    <div class="draw-content">
        <h2>It's a Draw!</h2>
        <h4>Well played by both of you!</h4>
        <button class="draw-restart">Play Again</button>
    </div>
</section>
</body>
</html>
